[project]
name = "chatgpt-max-bot"
version = "0.1.0"
description = "Мост между MAX-ботом и ChatGPT через браузер"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatgpt-browser>=0.1.0",
    "seleniumbase>=4.30.0",
    "maxapi>=0.9.14",
    "setuptools>=69.0.0",
    "python-dotenv",
    "requests>=2.32.0",
    "faster-whisper>=1.1.0",
    "py7zr>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.uv]
# uv будет использовать Python 3.11 по умолчанию для этого проекта
python-preference = "managed"